<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Button Types</h1>
    <section class="organism-card">
        <div class="c-block c-block--one">
            <h2>Button 1</h2>
            <button class="c-pill c-pill--primary">Primary</button>
        </div>
        <div class="c-block c-block--two">
            <h2>Button 2</h2>
            <button class="c-pill c-pill--secondary">Secondary</button>
        </div>
        <div class="c-block c-block--three">
            <h2>Button 3</h2>
            <button class="c-pill c-pill--disabled">Disabled</button>
        </div>
        <div class="c-block c-block--four">
            <h2>Button 4</h2>
            <button class="c-pill c-pill--error">Error</button>
        </div>
    </section>
</body>
</html>
